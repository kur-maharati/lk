<!DOCTYPE html>
<html lang="id">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="theme-color"
    content="#2563eb"
  >

  <meta
    name="description"
    content="Portal SMK Maharati"
  >

  <title>
    SMK Maharati
  </title>

  <link
    rel="stylesheet"
    href="style.css"
  >

</head>


<body>

  <main class="page">


    <!-- HEADER -->

    <header class="header">


      <!-- LOGO DARI GITHUB -->

      <div class="logo">

        <img
          src="assets/logo.png"
          alt="Logo SMK Maharati"
        >

      </div>


      <h1 id="schoolName">
        SMK Maharati
      </h1>


      <p id="pageTitle">
        Portal Asesmen & Pembelajaran
      </p>


      <div
        id="clock"
        class="clock"
      >
        --:--:--
      </div>


      <div
        id="connectionStatus"
        class="connection-status loading"
      >

        <span
          class="status-dot"
        ></span>

        <span id="statusText">
          Menghubungkan...
        </span>

      </div>


    </header>


    <!-- MENU -->

    <section
      id="menuContainer"
      class="menu-container"
    >

      <div class="loading-container">

        <div class="spinner"></div>

        <p>
          Memuat menu...
        </p>

      </div>

    </section>


    <!-- ERROR -->

    <section
      id="errorContainer"
      class="error-container hidden"
    >

      <div class="error-icon">
        ⚠️
      </div>


      <h3>
        Tidak dapat terhubung ke server
      </h3>


      <p id="errorMessage">
        Periksa koneksi internet
        kemudian coba lagi.
      </p>


      <button
        id="retryButton"
        class="retry-button"
      >
        ↻ Coba Lagi
      </button>

    </section>


    <!-- FOOTER -->

    <footer id="footer">
      © 2026 SMK Maharati
    </footer>


  </main>


  <script src="app.js"></script>

</body>

</html>
